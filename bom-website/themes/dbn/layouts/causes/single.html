{{ define "main" }}
<div class="detail-page">
  <div x-data="causeDetailData">
    <!-- Back link -->
    <a href="/database/" class="detail-back">&larr; Back to database</a>

    <!-- Loading state -->
    <div x-show="loading" class="detail-status">
      <div class="spinner"></div>
      <p>Loading cause data...</p>
    </div>

    <!-- Error state -->
    <div x-show="error && !loading" class="detail-status">
      <p class="is-error" x-text="error"></p>
    </div>

    <!-- Header (always visible once initialized) -->
    <div x-show="initialized" x-cloak>
      <h2 class="detail-title" x-text="causeName"></h2>
      <div class="detail-meta is-tight">
        <span x-show="originalName && originalName !== causeName">
          Original transcription: <span class="transcription" x-text="originalName"></span>
        </span>
      </div>
      <p x-show="definition" class="detail-definition">
        <strong>Definition:</strong> <span x-text="definition"></span>
        <a href="/dictionary/" class="detail-link">See full dictionary &rarr;</a>
      </p>

      <!-- Bill type toggle -->
      <div class="detail-toggle">
        <span>Bill type:</span>
        <button @click="setBillType('weekly')"
                :aria-pressed="billType === 'weekly'">
          Weekly
        </button>
        <button @click="setBillType('general')"
                :aria-pressed="billType === 'general'">
          General (Annual)
        </button>
      </div>
    </div>

    <!-- Data content -->
    <div x-show="!loading && !error" x-cloak>
      <!-- Summary cards -->
      <div class="stat-grid is-summary">
        <div class="stat-card">
          <div class="stat-label">Total Deaths</div>
          <div class="stat-value" x-text="totalCount.toLocaleString()"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Years of Data</div>
          <div class="stat-value" x-text="yearData.length"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Bill Type</div>
          <div class="stat-value is-text" x-text="billType"></div>
        </div>
      </div>

      <!-- Chart -->
      <div class="chart-panel">
        <h3>Deaths by Year</h3>
        <div id="causeChart"></div>
        <div x-show="yearData.length === 0" class="empty">No data available for this cause and bill type.</div>
      </div>

      <!-- Year-by-year table -->
      <div class="table-panel">
        <div class="table-panel-header">
          <h3>Year-by-Year Breakdown</h3>
        </div>
        <div class="table-scroll">
          <table class="detail-table is-hoverable">
            <thead>
              <tr>
                <th>Year</th>
                <th class="num">Count</th>
                <th class="num">Weeks</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="y in yearData" :key="y.year">
                <tr>
                  <td class="year" x-text="y.year"></td>
                  <td class="num" x-text="y.total.toLocaleString()"></td>
                  <td class="num weeks" x-text="y.weeks"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>

<script>
// Draw a chart once its container has a width, and again whenever that width
// changes (the container is hidden while data loads, so it can start at 0px).
function drawWhenSized(el, draw) {
  if (el._sizeObserver) el._sizeObserver.disconnect();
  let lastWidth = 0;
  el._sizeObserver = new ResizeObserver(([entry]) => {
    const width = Math.round(entry.contentRect.width);
    if (width > 0 && width !== lastWidth) { lastWidth = width; draw(width); }
  });
  el._sizeObserver.observe(el);
}

// Chart text matches the site's other charts
const chartStyle = { fontSize: '12px', fontFamily: 'var(--font-ui)' };

document.addEventListener('alpine:init', () => {
  Alpine.data('causeDetailData', () => ({
    causeName: '',
    originalName: '',
    definition: '',
    billType: 'weekly',
    yearData: [],
    totalCount: 0,
    loading: true,
    initialized: false,
    error: null,

    async init() {
      const params = new URLSearchParams(window.location.search);
      this.causeName = params.get('name') || '';
      this.billType = params.get('bill_type') || 'weekly';

      if (!this.causeName) {
        this.error = 'No cause specified.';
        this.loading = false;
        return;
      }

      document.title = `${this.causeName} - {{ .Site.Title }}`;
      await this.fetchData();
      this.initialized = true;
    },

    async setBillType(type) {
      this.billType = type;
      // Update URL
      const params = new URLSearchParams(window.location.search);
      params.set('bill_type', type);
      history.replaceState({}, '', location.pathname + '?' + params.toString());
      await this.fetchData();
    },

    async fetchData() {
      this.loading = true;
      this.error = null;

      try {
        const load = async (name) => (await fetch(
          `https://data.chnm.org/bom/causes?id=${encodeURIComponent(name)}&bill-type=${this.billType}&start-year=1629&end-year=1754&limit=50000`,
          { cache: 'no-cache' }
        )).json();
        let data = await load(this.causeName);
        // Cause ids are lower case in the API; accept any casing in the URL.
        if ((!data || data.length === 0) && this.causeName !== this.causeName.toLowerCase()) {
          data = await load(this.causeName.toLowerCase());
        }

        if (!data || data.length === 0) {
          this.yearData = [];
          this.totalCount = 0;
          this.loading = false;
          return;
        }

        // Grab metadata from first record
        this.originalName = data[0].death || '';
        this.definition = data[0].definition || '';

        // Aggregate by year
        const byYear = {};
        for (const record of data) {
          const year = record.year;
          if (!byYear[year]) {
            byYear[year] = { year, total: 0, weeks: 0 };
          }
          byYear[year].total += record.count || 0;
          byYear[year].weeks++;
        }

        this.yearData = Object.values(byYear).sort((a, b) => a.year - b.year);
        this.totalCount = this.yearData.reduce((sum, y) => sum + y.total, 0);

        drawWhenSized(document.getElementById('causeChart'), (width) => this.renderChart(width));
      } catch (e) {
        console.error('Error loading cause data:', e);
        this.error = 'Failed to load cause data. Please try again.';
      } finally {
        this.loading = false;
      }
    },

    renderChart(width) {
      const el = document.getElementById('causeChart');
      if (!el || !this.yearData.length) return;

      el.innerHTML = '';
      const ticks5 = this.yearData.map(d => d.year).filter(y => y % 5 === 0);
      const tipFmt = { format: { x: d => String(d) } };

      el.appendChild(Plot.plot({
        width,
        height: 300,
        marginLeft: 60,
        style: chartStyle,
        x: {
          label: null,
          interval: 1,
          ticks: ticks5.length > 1 ? ticks5 : undefined,
          tickFormat: d => String(d),
        },
        y: { label: 'Deaths', grid: true },
        marks: [
          Plot.barY(this.yearData, { x: 'year', y: 'total', fill: '#4a73a0', tip: tipFmt }),
          Plot.crosshairX(this.yearData, { x: 'year', y: 'total' }),
          Plot.ruleY([0]),
        ],
      }));
    },
  }));
});
</script>
{{ end }}
