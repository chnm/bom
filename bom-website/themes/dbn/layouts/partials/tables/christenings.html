{{/* This is the Christenings table. */}}
<div>
      <div id="control-christenings" class="db-controls">
        <div class="db-controls-row">
          <p class="db-summary" x-html="getSummary"></p>
          <div class="db-pager">
             <button @click="changePage(1)" :disabled="page === 1">First</button>
             <button @click="changePage(page - 1)" :disabled="page === 1">Previous</button>
             <button @click="changePage(page + 1)" :disabled="page === pagination.lastPage">Next</button>
          </div>
        </div>
      </div>

      {{/* begin: christenings table */}}
    <div id="table-christenings">
      <table class="db-table">
        <thead>
          <tr>
            <th scope="col"
              class="col-text"
              width="35%" @click="sort('christening')">Description</th>
            <th scope="col" width="20%" @click="sort('count')">Count</th>
            <th scope="col" width="15%" @click="sort('week_number')">Week</th>
            <th scope="col" width="15%" @click="sort('year')">Year</th>
          </tr>
        </thead>
        <tbody>
          <!-- Loading state -->
          <template x-if="meta.loading">
            <tr>
              <td colspan="4" class="db-state">
                <div class="db-state-body">
                  <div class="spinner"></div>
                  <div class="db-state-text">
                    <span x-show="!meta.slowConnection">Loading data...</span>
                    <span x-show="meta.slowConnection" class="is-slow">Taking longer than expected...</span>
                  </div>
                </div>
              </td>
            </tr>
          </template>

          <!-- Error state -->
          <template x-if="meta.error && !meta.loading">
            <tr>
              <td colspan="4" class="db-state">
                <div class="db-state-body">
                  <div class="db-state-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.5 0L4.732 15.5c-.77.833.192 2.5 1.732 2.5z"></path>
                    </svg>
                  </div>
                  <div class="db-state-text">
                    <div class="db-state-title">Unable to load data</div>
                    <div class="db-state-action">
                      <button @click="applyFilters()" class="db-retry">Try again</button>
                    </div>
                  </div>
                </div>
              </td>
            </tr>
          </template>

          <!-- Data rows -->
          <template x-if="!meta.loading && !meta.error">
            <template x-for="christening in christenings" :key="christening.id">
              <tr>
                <td class="col-name"
                  x-text="christening.christening"></td>
                <td class="col-num"
                    :class="(christening.count == null) ? 'is-missing' : (christening.illegible ? 'is-illegible' : '')">
                  <span x-show="christening.count == null" class="flag-missing">data missing from record</span>
                  <span x-show="christening.illegible && christening.count != null" class="val-illegible" x-text="christening.count"></span>
                  <span x-show="christening.illegible && christening.count != null" class="flag-illegible">illegible</span>
                  <span x-show="christening.count != null && !christening.illegible && christening.count != null" x-text="christening.count"></span>
                </td>
                <td class="col-num"
                  x-text="christening.week_number"></td>
                <td class="col-num"
                  x-text="christening.year"></td>
              </tr>
            </template>
          </template>
        </tbody>
      </table>
    </div>

      <div id="control-christenings" class="db-controls db-controls-end">
        <div class="db-controls-row">
          <p class="db-summary" x-html="getSummary"></p>
          <div class="db-pager">
             <button @click="changePage(1)" :disabled="page === 1">First</button>
             <button @click="changePage(page - 1)" :disabled="page === 1">Previous</button>
             <button @click="changePage(page + 1)" :disabled="page === pagination.lastPage">Next</button>
          </div>
        </div>
      </div>
      {{/* end: christenings table */}}
</div>
