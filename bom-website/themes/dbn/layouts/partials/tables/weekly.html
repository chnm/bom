{{/* This is the Weekly Bills table. */}}
<div>
      <div id="control-weekly" class="db-controls">
        <div class="db-controls-row">
          <p class="db-summary" x-html="getSummary"></p>
          <div class="db-pager">
             <button @click="changePage(1)" :disabled="page === 1">First</button>
             <button @click="changePage(page - 1)" :disabled="page === 1">Previous</button>
             <button @click="changePage(page + 1)" :disabled="page === pagination.lastPage">Next</button>
          </div>
        </div>
      </div>


      {{/* begin: weeklies table */}}
      <div id="table-weekly">
      <table class="db-table">
        <thead>
          <tr>
            <th scope="col"
              class="col-text"
              width="30%" @click="sort('name')">Parish</th>
            <th scope="col" width="15%" @click="sort('count')">Buried</th>
            <th scope="col" width="15%">Plague</th>
            <th scope="col" width="10%" @click="sort('week_number')">Week</th>
            <th scope="col" width="10%" @click="sort('year')">Year</th>
            <th scope="col" width="20%">Split Year</th>
          </tr>
        </thead>
        <tbody>
          <!-- Loading state -->
          <template x-if="meta.loading">
            <tr>
              <td colspan="6" class="db-state">
                <div class="db-state-body">
                  <div class="spinner"></div>
                  <div class="db-state-text">
                    <span x-show="!meta.slowConnection">Loading data...</span>
                    <span x-show="meta.slowConnection" class="is-slow">Taking longer than expected...</span>
                  </div>
                </div>
              </td>
            </tr>
          </template>

          <!-- Error state -->
          <template x-if="meta.error && !meta.loading">
            <tr>
              <td colspan="6" class="db-state">
                <div class="db-state-body">
                  <div class="db-state-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.5 0L4.732 15.5c-.77.833.192 2.5 1.732 2.5z"></path>
                    </svg>
                  </div>
                  <div class="db-state-text">
                    <div class="db-state-title">Unable to load data</div>
                    <div>Your connection may be too slow or unstable.</div>
                    <div class="db-state-action">
                      <button @click="applyFilters()" class="db-retry">Try again</button>
                    </div>
                  </div>
                </div>
              </td>
            </tr>
          </template>

          <!-- Data rows (pivoted: one row per parish per week) -->
          <template x-if="!meta.loading && !meta.error">
            <template x-for="row in pivotedBills" :key="row.name + row.week_number + row.year">
              <tr>
                <td class="col-name">
                  <a :href="'/parishes/detail/?name=' + encodeURIComponent(row.name)" x-text="row.name"></a>
                </td>
                <td class="col-num"
                    :class="row.buried_missing ? 'is-missing' : (row.buried_illegible ? 'is-illegible' : '')">
                  <span x-show="row.buried_missing" class="flag-missing">data missing from bill</span>
                  <span x-show="row.buried_illegible && !row.buried_missing" class="val-illegible" x-text="row.buried"></span>
                  <span x-show="row.buried_illegible && !row.buried_missing" class="flag-illegible">illegible</span>
                  <span x-show="!row.buried_missing && !row.buried_illegible && (row.buried !== null && row.buried !== undefined)" x-text="row.buried"></span>
                  <span x-show="!row.buried_missing && !row.buried_illegible && (row.buried === null || row.buried === undefined)" class="val-empty">—</span>
                </td>
                <td class="col-num"
                    :class="row.plague_missing ? 'is-missing' : (row.plague_illegible ? 'is-illegible' : '')">
                  <span x-show="row.plague_missing" class="flag-missing">data missing from bill</span>
                  <span x-show="row.plague_illegible && !row.plague_missing" class="val-illegible" x-text="row.plague"></span>
                  <span x-show="row.plague_illegible && !row.plague_missing" class="flag-illegible">illegible</span>
                  <span x-show="!row.plague_missing && !row.plague_illegible && (row.plague !== null && row.plague !== undefined)" :class="{ 'is-plague': row.plague > 0 }" x-text="row.plague"></span>
                  <span x-show="!row.plague_missing && !row.plague_illegible && (row.plague === null || row.plague === undefined)" class="val-empty">—</span>
                </td>
                <td class="col-num"
                  x-text="row.week_number"></td>
                <td class="col-num"
                  x-text="row.year"></td>
                <td class="col-num"
                  x-text="row.split_year"></td>
              </tr>
            </template>
          </template>
        </tbody>
      </table>

      <div id="control-weekly" class="db-controls db-controls-end">
        <div class="db-controls-row">
          <p class="db-summary" x-html="getSummary"></p>
          <div class="db-pager">
             <button @click="changePage(1)" :disabled="page === 1">First</button>
             <button @click="changePage(page - 1)" :disabled="page === 1">Previous</button>
             <button @click="changePage(page + 1)" :disabled="page === pagination.lastPage">Next</button>
          </div>
        </div>
      </div>
      </div>
    </div>
    {{/* end: weeklies table */}}
