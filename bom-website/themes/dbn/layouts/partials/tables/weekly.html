{{/* This is the Weekly Bills table. */}}
<div>
      <div id="control-weekly" class="mb-2">
        <div class="flex items-center justify-between">
          <p class="text-sm text-gray-700 py-1" x-html="getSummary"></p>
          <div class="flex items-center space-x-1">
            <button
              class="bg-white border border-gray-300 text-gray-500 hover:bg-gray-100 hover:text-gray-700 rounded-l-lg leading-tight py-2 px-3 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
              :class="{'disabled:bg-slate-50 disabled:text-slate-500 disabled:border-slate-200 disabled:shadow-none': page === 1}"
              @click="changePage(1)" :disabled="page === 1">First</button>
            <button
              class="bg-white border border-gray-300 text-gray-500 hover:bg-gray-100 hover:text-gray-700 leading-tight py-2 px-3 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
              :class="{'disabled:bg-slate-50 disabled:text-slate-500 disabled:border-slate-200 disabled:shadow-none': page === 1}"
              @click="changePage(page - 1)" :disabled="page === 1">Previous</button>
            <button
              class="bg-white border border-gray-300 text-gray-500 hover:bg-gray-100 hover:text-gray-700 rounded-r-lg leading-tight py-2 px-3 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
              :class="{'disabled:bg-slate-50 disabled:text-slate-500 disabled:border-slate-200 disabled:shadow-none': page === pagination.lastPage}"
              @click="changePage(page + 1)" :disabled="page === pagination.lastPage">Next</button>
          </div>
        </div>
      </div>


      {{/* begin: weeklies table */}}
      <div id="table-weekly">
      <table class="min-w-full divide-y divide-gray-200 table-fixed dark:divide-gray-700">
        <thead class="bg-gray-100 dark:bg-gray-700">
          <tr>
            <th scope="col"
              class="py-3 px-6 text-xs font-medium tracking-wider text-left text-gray-700 uppercase dark:text-gray-400"
              width="30%" @click="sort('name')">Parish</th>
            <th scope="col"
              class="py-3 px-6 text-xs font-medium text-center tracking-wider text-gray-700 uppercase dark:text-gray-400"
              width="15%" @click="sort('count')">Buried</th>
            <th scope="col"
              class="py-3 px-6 text-xs font-medium text-center tracking-wider text-gray-700 uppercase dark:text-gray-400"
              width="15%">Plague</th>
            <th scope="col"
              class="py-3 px-6 text-xs font-medium tracking-wider text-center text-gray-700 uppercase dark:text-gray-400"
              width="10%" @click="sort('week_number')">Week</th>
            <th scope="col"
              class="py-3 px-6 text-xs font-medium tracking-wider text-center text-gray-700 uppercase dark:text-gray-400"
              width="10%" @click="sort('year')">Year</th>
            <th scope="col"
              class="py-3 px-6 text-xs font-medium tracking-wider text-center text-gray-700 uppercase dark:text-gray-400"
              width="20%">Split Year</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700">
          <!-- Loading state -->
          <template x-if="meta.loading">
            <tr>
              <td colspan="6" class="py-12 text-center">
                <div class="flex flex-col items-center justify-center space-y-3">
                  <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-600"></div>
                  <div class="text-sm text-gray-600">
                    <span x-show="!meta.slowConnection">Loading data...</span>
                    <span x-show="meta.slowConnection" class="text-amber-600">Taking longer than expected...</span>
                  </div>
                </div>
              </td>
            </tr>
          </template>

          <!-- Error state -->
          <template x-if="meta.error && !meta.loading">
            <tr>
              <td colspan="6" class="py-12 text-center">
                <div class="flex flex-col items-center justify-center space-y-3">
                  <div class="text-red-500">
                    <svg class="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.5 0L4.732 15.5c-.77.833.192 2.5 1.732 2.5z"></path>
                    </svg>
                  </div>
                  <div class="text-sm text-gray-600">
                    <div class="font-medium text-red-600 mb-2">Unable to load data</div>
                    <div>Your connection may be too slow or unstable.</div>
                    <div class="mt-2">
                      <button @click="applyFilters()" class="text-dbn-blue-700 hover:text-dbn-blue-900 underline">Try again</button>
                    </div>
                  </div>
                </div>
              </td>
            </tr>
          </template>

          <!-- Data rows (pivoted: one row per parish per week) -->
          <template x-if="!meta.loading && !meta.error">
            <template x-for="row in pivotedBills" :key="row.name + row.week_number + row.year">
              <tr class="hover:bg-gray-100 dark:hover:bg-gray-700">
                <td class="py-3 px-6 text-sm font-medium text-gray-900 whitespace-nowrap dark:text-white">
                  <a :href="'/parishes/detail/?name=' + encodeURIComponent(row.name)" class="text-dbn-blue-700 hover:text-dbn-blue-900 hover:underline" x-text="row.name"></a>
                </td>
                <td class="py-3 px-6 text-sm text-center whitespace-nowrap font-mono"
                    :class="row.buried_missing ? 'bg-amber-50' : (row.buried_illegible ? 'bg-orange-50' : '')">
                  <span x-show="row.buried_missing" class="text-xs text-amber-700">data missing from bill</span>
                  <span x-show="row.buried_illegible && !row.buried_missing" class="text-orange-700" x-text="row.buried"></span>
                  <span x-show="row.buried_illegible && !row.buried_missing" class="ml-1 text-xs text-orange-500">illegible</span>
                  <span x-show="!row.buried_missing && !row.buried_illegible && (row.buried !== null && row.buried !== undefined)" class="text-gray-900 dark:text-white" x-text="row.buried"></span>
                  <span x-show="!row.buried_missing && !row.buried_illegible && (row.buried === null || row.buried === undefined)" class="text-gray-300">—</span>
                </td>
                <td class="py-3 px-6 text-sm text-center whitespace-nowrap font-mono"
                    :class="row.plague_missing ? 'bg-amber-50' : (row.plague_illegible ? 'bg-orange-50' : (row.plague > 0 ? '' : ''))">
                  <span x-show="row.plague_missing" class="text-xs text-amber-700">data missing from bill</span>
                  <span x-show="row.plague_illegible && !row.plague_missing" class="text-orange-700" x-text="row.plague"></span>
                  <span x-show="row.plague_illegible && !row.plague_missing" class="ml-1 text-xs text-orange-500">illegible</span>
                  <span x-show="!row.plague_missing && !row.plague_illegible && (row.plague !== null && row.plague !== undefined)" :class="row.plague > 0 ? 'text-red-700 dark:text-red-400' : 'text-gray-900 dark:text-white'" x-text="row.plague"></span>
                  <span x-show="!row.plague_missing && !row.plague_illegible && (row.plague === null || row.plague === undefined)" class="text-gray-300">—</span>
                </td>
                <td class="py-3 px-6 text-sm text-center text-gray-900 whitespace-nowrap dark:text-white font-mono"
                  x-text="row.week_number"></td>
                <td class="py-3 px-6 text-sm text-center text-gray-900 whitespace-nowrap dark:text-white font-mono"
                  x-text="row.year"></td>
                <td class="py-3 px-6 text-sm text-center text-gray-900 whitespace-nowrap dark:text-white font-mono"
                  x-text="row.split_year"></td>
              </tr>
            </template>
          </template>
        </tbody>
      </table>

      <div id="control-weekly" class="mt-4">
        <div class="flex items-center justify-between">
          <p class="text-sm text-gray-700 py-1" x-html="getSummary"></p>
          <div class="flex items-center space-x-1">
            <button
              class="bg-white border border-gray-300 text-gray-500 hover:bg-gray-100 hover:text-gray-700 rounded-l-lg leading-tight py-2 px-3 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
              :class="{'disabled:bg-slate-50 disabled:text-slate-500 disabled:border-slate-200 disabled:shadow-none': page === 1}"
              @click="changePage(1)" :disabled="page === 1">First</button>
            <button
              class="bg-white border border-gray-300 text-gray-500 hover:bg-gray-100 hover:text-gray-700 leading-tight py-2 px-3 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
              :class="{'disabled:bg-slate-50 disabled:text-slate-500 disabled:border-slate-200 disabled:shadow-none': page === 1}"
              @click="changePage(page - 1)" :disabled="page === 1">Previous</button>
            <button
              class="bg-white border border-gray-300 text-gray-500 hover:bg-gray-100 hover:text-gray-700 rounded-r-lg leading-tight py-2 px-3 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
              :class="{'disabled:bg-slate-50 disabled:text-slate-500 disabled:border-slate-200 disabled:shadow-none': page === pagination.lastPage}"
              @click="changePage(page + 1)" :disabled="page === pagination.lastPage">Next</button>
          </div>
        </div>
      </div>
      </div>
    </div>
    {{/* end: weeklies table */}}
