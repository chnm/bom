<!DOCTYPE html>
<html lang="en">
    {{- partial "head.html" . -}}
    <body class="bg-dbn-green-700 min-h-screen flex flex-col">
        <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:p-4 focus:bg-white focus:text-dbn-green-700 focus:font-bold">Skip to main content</a>
        {{ if .IsHome }}
        {{- partial "hero.html" . -}}
        {{- else }}
        {{- partial "header.html" . -}}
        {{- end }}
        <div class="bg-white flex-grow text-ink" id="content">
        <main id="main-content">
        {{- block "main" . }}{{- end }}
        </main>
        </div>
        {{- partial "footer.html" . -}}
        <script src="https://unpkg.com/littlefoot/dist/littlefoot.js"></script>
        <style>
            .littlefoot__button {
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
                background-color: #fbf8f1 !important;
                border: 1px solid #e0d8c6 !important;
                border-radius: 9999px !important;
                padding: 0.15em 0.5em !important;
                vertical-align: super !important;
                font-size: 0.7em !important;
            }
            .littlefoot__button i {
                line-height: 1 !important;
                color: #9a3324 !important;
                font-size: 0.75em !important;
            }
            .littlefoot__button:hover {
                background-color: #9a3324 !important;
                border-color: #9a3324 !important;
            }
            .littlefoot__button:hover i {
                color: white !important;
            }
        </style>
        <script>
            littlefoot.littlefoot({
                buttonTemplate: '<button aria-expanded="false" aria-label="Footnote <% number %>" class="littlefoot__button" id="<% reference %>" title="See Footnote <% number %>"><i class="fa-solid fa-asterisk fa-lg"></i></button>'
            })
        </script>
    </body>
</html>
