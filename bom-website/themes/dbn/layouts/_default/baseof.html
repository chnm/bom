<!DOCTYPE html>
<html lang="en">
    {{- partial "head.html" . -}}
    <body class="bg-dbn-green-700 min-h-screen flex flex-col">
        <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:p-4 focus:bg-white focus:text-dbn-green-700 focus:font-bold">Skip to main content</a>
        {{ if .IsHome }}
        {{- partial "hero.html" . -}}
        {{- else }}
        {{- partial "header.html" . -}}
        {{- end }}
        <div class="bg-white flex-grow" id="content">
        <main id="main-content">
        {{- block "main" . }}{{- end }}
        </main>
        </div>
        {{- partial "footer.html" . -}}
        <script src="https://unpkg.com/littlefoot/dist/littlefoot.js"></script>
        <style>
            .littlefoot__button {
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
            }
            .littlefoot__button i {
                line-height: 1 !important;
            }
        </style>
        <script>
            littlefoot.littlefoot({
                buttonTemplate: '<button aria-expanded="false" aria-label="Footnote <% number %>" class="littlefoot__button" id="<% reference %>" title="See Footnote <% number %>"><i class="fa-solid fa-asterisk fa-lg"></i></button>'
            })
        </script>
    </body>
</html>
