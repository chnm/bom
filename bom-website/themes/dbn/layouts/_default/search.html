{{ define "main" }}
<div class="page search-page">
  <h1 class="page-title">{{ .Title }}</h1>

  <div id="search"></div>

  <link href="/pagefind/pagefind-ui.css" rel="stylesheet">
  <script src="/pagefind/pagefind-ui.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', (event) => {
      new PagefindUI({
        element: "#search",
        showSubResults: true,
        excerptLength: 20
      });
    });
  </script>
</div>
{{ end }}
